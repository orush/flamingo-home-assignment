name: Framework self-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: the workflow needs nothing more.
permissions:
  contents: read

concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Framework self-tests
    # Pinned for the same reason as tests.yml: Playwright's --with-deps installs
    # OS packages per distribution.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The self-tests need the environment too: one checks that every required
      # key resolves, and the Playwright smoke test loads the real site.
      - name: Set up JDK, .env and Chromium
        uses: ./.github/actions/setup
        with:
          booker-base-url: ${{ secrets.BOOKER_BASE_URL }}
          booker-username: ${{ secrets.BOOKER_USERNAME }}
          booker-password: ${{ secrets.BOOKER_PASSWORD }}
          graphql-endpoint: ${{ secrets.GRAPHQL_ENDPOINT }}
          ui-base-url: ${{ secrets.UI_BASE_URL }}

      - name: Run the framework self-tests
        run: ./mvnw -B clean test -Dgroups=framework

      - name: Generate the Allure report
        if: always()
        env:
          # Only the allure2 report plugin can turn off its Google Analytics tag.
          ALLURE_NO_ANALYTICS: 'true'
        run: ./mvnw -B allure:report

      - name: Summarise the run
        if: always()
        run: python3 .github/scripts/summarise_results.py target/allure-results >> "$GITHUB_STEP_SUMMARY"

      # This repository is public, so artifacts are too. Uploads happen only if
      # this check finds no credential in anything about to be uploaded.
      - name: Check artifacts for credentials
        id: secret-check
        if: always()
        env:
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: >-
          python3 .github/scripts/check_no_secrets.py
          target/allure-results
          target/site/allure-maven-plugin
          target/surefire-reports

      - name: Upload the Allure report
        if: always() && steps.secret-check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: framework-allure-report
          path: target/site/allure-maven-plugin/index.html
          retention-days: 14

      - name: Upload raw results and Surefire reports
        if: always() && steps.secret-check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: framework-test-results
          path: |
            target/allure-results
            target/surefire-reports
          retention-days: 14

      - name: Upload failure screenshots and traces
        if: always() && steps.secret-check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: framework-failure-diagnostics
          path: |
            target/screenshots
            target/traces
          if-no-files-found: ignore
          retention-days: 14
