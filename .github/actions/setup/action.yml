name: Set up the test environment
description: >-
  JDK 17, a .env built from the repository secrets, and Chromium for Playwright.
  Shared by the scenario and framework workflows.

# Composite actions cannot read the secrets context, so each workflow passes
# the secrets in as inputs.
inputs:
  booker-base-url:
    required: true
  booker-username:
    required: true
  booker-password:
    required: true
  graphql-endpoint:
    required: true
  ui-base-url:
    required: true

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven

    - name: Create .env from repository secrets
      shell: bash
      env:
        BOOKER_BASE_URL: ${{ inputs.booker-base-url }}
        BOOKER_USERNAME: ${{ inputs.booker-username }}
        BOOKER_PASSWORD: ${{ inputs.booker-password }}
        GRAPHQL_ENDPOINT: ${{ inputs.graphql-endpoint }}
        UI_BASE_URL: ${{ inputs.ui-base-url }}
      # Secrets arrive as environment variables rather than as ${{ }} text
      # spliced into the script, so no value can alter the script itself.
      # Nothing here prints them.
      run: |
        keys="BOOKER_BASE_URL BOOKER_USERNAME BOOKER_PASSWORD GRAPHQL_ENDPOINT UI_BASE_URL"
        for key in $keys; do
          if [ -z "${!key}" ]; then
            echo "::error::Repository secret $key is not set. Secrets are not passed to pull requests from forks."
            exit 1
          fi
        done
        umask 077
        { for key in $keys; do printf '%s=%s\n' "$key" "${!key}"; done; echo "UI_HEADLESS=true"; } > .env

    - name: Install Chromium for Playwright
      shell: bash
      run: >-
        ./mvnw -B -q compile exec:java
        -Dexec.mainClass=com.microsoft.playwright.CLI
        -Dexec.args="install --with-deps chromium"
