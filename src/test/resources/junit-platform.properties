# Parallel execution: test classes run concurrently, the methods of one class
# run one after another on one thread.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# A fixed four threads. Deliberately not "one per core": these are public
# services the brief asks us not to overload.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
# Without a cap, JUnit's fork-join pool may add up to 256 compensating threads
# when workers block. Each UI worker thread owns a browser, so this cap is what
# actually holds the run to four concurrent browsers.
junit.jupiter.execution.parallel.config.fixed.max-pool-size=4
